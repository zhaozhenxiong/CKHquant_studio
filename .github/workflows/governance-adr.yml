name: CZSC runtime checks
on: [pull_request, push]
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv-ci/bin/python
          - os: windows-latest
            python: .venv-ci/Scripts/python.exe
          - os: macos-15
            python: .venv-ci/bin/python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --isolated -r app/requirements-czsc-runtime.lock
      - run: python app/build_czsc_runtime.py --out app/vendor/wheels --no-install
      - run: python install.py --venv-dir .venv-ci --device cpu
      - run: ${{ matrix.python }} -m my_strategy.scripts.ci_guard --skip-docker
      - run: ${{ matrix.python }} -m pip wheel . --no-deps --no-build-isolation --wheel-dir .scratch/application-wheels
      - run: ${{ matrix.python }} -m pip install --no-deps --force-reinstall .scratch/application-wheels/khquant-1.0.0-py3-none-any.whl
      - name: Verify the actual installed application wheel
        shell: python
        env:
          KHQUANT_CI_PYTHON: ${{ matrix.python }}
        run: |
          import hashlib, os, subprocess
          from pathlib import Path
          wheel = Path('.scratch/application-wheels/khquant-1.0.0-py3-none-any.whl')
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          executable = str(Path(os.environ['KHQUANT_CI_PYTHON']).absolute())
          subprocess.run([executable, '-I', 'app/verify_installation.py', '--device', 'cpu',
                          '--expected-version', '1.0.0', '--expected-wheel-sha256', digest,
                          '--output', 'installation-cpu.json'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            app/vendor/wheels/*.whl
            app/vendor/wheels/wheel-index.json
            installation-cpu.json
