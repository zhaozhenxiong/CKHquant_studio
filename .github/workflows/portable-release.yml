name: Assemble portable release
on:
  workflow_dispatch:
    inputs:
      verify_mps:
        description: Run the Apple Silicon hardware gate on a configured self-hosted Mac
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv-ci/bin/python
          - os: windows-latest
            python: .venv-ci/Scripts/python.exe
          - os: macos-15
            python: .venv-ci/bin/python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --isolated -r app/requirements-czsc-runtime.lock
      - run: python app/build_czsc_runtime.py --out .scratch/native-wheel --no-install
      - name: Align checkout native bytes with the verified fresh index
        shell: python
        run: |
          import hashlib, json, shutil
          from pathlib import Path
          directory = Path('.scratch/native-wheel')
          index = json.loads((directory / 'wheel-index.json').read_text(encoding='utf-8'))
          entries = {entry['filename']: entry for entry in index['wheels']}
          wheels = list(directory.glob('*.whl'))
          assert len(wheels) == 1, 'Fresh native output must contain exactly one platform wheel'
          destination = Path('app/vendor/wheels')
          for wheel in wheels:
              entry = entries[wheel.name]
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              assert digest == entry['sha256'], 'Fresh native wheel checksum mismatch'
              assert entry['build']['cargo_locked'] is True and entry['build']['source_algorithm_patches'] is False
              shutil.copy2(wheel, destination / wheel.name)
              assert hashlib.sha256((destination / wheel.name).read_bytes()).hexdigest() == digest
      - run: python install.py --venv-dir .venv-ci --wheel-dir .scratch/native-wheel --device cpu
      - run: ${{ matrix.python }} -m my_strategy.scripts.ci_guard --skip-docker
      - run: ${{ matrix.python }} -m pip wheel . --no-deps --no-build-isolation --wheel-dir .scratch/application-wheels
      - run: ${{ matrix.python }} -m pip install --no-deps --force-reinstall .scratch/application-wheels/khquant-0.1.3-py3-none-any.whl
      - name: Verify isolated installed application identity
        shell: python
        env:
          KHQUANT_CI_PYTHON: ${{ matrix.python }}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          executable = str(Path(os.environ['KHQUANT_CI_PYTHON']).resolve())
          probe = '''import importlib.metadata, json, sys
          from pathlib import Path
          import my_strategy
          path = Path(my_strategy.__file__).resolve()
          assert path.is_relative_to(Path(sys.prefix).resolve()) and 'site-packages' in path.parts
          assert importlib.metadata.version('khquant') == '0.1.3'
          print(json.dumps({'version': '0.1.3', 'package_path': str(path), 'prefix': sys.prefix,
                            'application_import': 'installed wheel site-packages',
                            'direct_url': json.loads(importlib.metadata.distribution('khquant').read_text('direct_url.json'))}))'''
          identity = json.loads(subprocess.check_output([executable, '-I', '-c', probe], text=True))
          wheel = Path('.scratch/application-wheels/khquant-0.1.3-py3-none-any.whl')
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert identity.pop('direct_url')['archive_info']['hashes']['sha256'] == digest
          identity['application_wheel_sha256'] = digest
          identity['source_commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          Path('installation-identity.json').write_text(json.dumps(identity, indent=2), encoding='utf-8')
      - run: ${{ matrix.python }} app/verify_installation.py --device cpu --output installation-cpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: .scratch/native-wheel/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: application-wheel-${{ matrix.os }}
          path: .scratch/application-wheels/khquant-0.1.3-py3-none-any.whl
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: installation-${{ matrix.os }}
          path: |
            installation-cpu.json
            installation-identity.json
          if-no-files-found: error
  archive:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --isolated -r app/requirements-czsc-runtime.lock
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: .scratch/native-assets
      - run: python app/build_release.py --output-dir dist/releases/0.1.3 --wheel-dir .scratch/native-assets/wheels-ubuntu-latest --wheel-dir .scratch/native-assets/wheels-windows-latest --wheel-dir .scratch/native-assets/wheels-macos-15
      # The portable application wheel must contain the merged native provenance
      # index, rather than a single platform job's separately verified index.
      - run: python -m pip wheel dist/releases/0.1.3/KHQuant-0.1.3 --no-deps --no-build-isolation --wheel-dir dist/releases/0.1.3
      - run: python dist/releases/0.1.3/KHQuant-0.1.3/install.py --venv-dir "$GITHUB_WORKSPACE/.venv-archive" --device cpu
      - run: .venv-archive/bin/python -m pip install --no-deps --force-reinstall dist/releases/0.1.3/khquant-0.1.3-py3-none-any.whl
      - name: Verify final combined application wheel identity
        shell: python
        run: |
          import hashlib, json, subprocess
          from pathlib import Path
          probe = '''import importlib.metadata, json, sys
          from pathlib import Path
          import my_strategy
          path = Path(my_strategy.__file__).resolve()
          assert path.is_relative_to(Path(sys.prefix).resolve()) and 'site-packages' in path.parts
          assert importlib.metadata.version('khquant') == '0.1.3'
          print(json.dumps({'version': '0.1.3', 'package_path': str(path), 'prefix': sys.prefix,
                            'application_import': 'installed wheel site-packages',
                            'direct_url': json.loads(importlib.metadata.distribution('khquant').read_text('direct_url.json'))}))'''
          executable = str(Path('.venv-archive/bin/python').resolve())
          identity = json.loads(subprocess.check_output([executable, '-I', '-c', probe], text=True))
          wheel = Path('dist/releases/0.1.3/khquant-0.1.3-py3-none-any.whl')
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert identity.pop('direct_url')['archive_info']['hashes']['sha256'] == digest
          identity['application_wheel_sha256'] = digest
          identity['source_commit'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          identity['native_provenance'] = 'combined three-platform index from assembled source package'
          Path('dist/releases/0.1.3/installation-combined-identity.json').write_text(json.dumps(identity, indent=2), encoding='utf-8')
      - run: .venv-archive/bin/python dist/releases/0.1.3/KHQuant-0.1.3/app/verify_installation.py --device cpu --output dist/releases/0.1.3/installation-combined-cpu.json
      - uses: actions/download-artifact@v4
        with:
          pattern: installation-*
          path: dist/releases/0.1.3/platform-verification
      - name: Extend checksums with verified application and installation assets
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          root = Path('dist/releases/0.1.3')
          checksum = root / 'SHA256SUMS.txt'
          previous = checksum.read_text(encoding='utf-8')
          assert 'KHQuant-0.1.3.zip' in previous
          assets = [*root.glob('*.whl'), *root.glob('installation-*.json'), *root.glob('platform-verification/**/*.json')]
          assert assets and all(path.is_file() for path in assets)
          entries = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}\n' for path in sorted(assets))
          checksum.write_text(previous + entries, encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: KHQuant-source-release
          if-no-files-found: error
          path: |
            dist/releases/0.1.3/*.zip
            dist/releases/0.1.3/*.whl
            dist/releases/0.1.3/SHA256SUMS.txt
            dist/releases/0.1.3/installation-*.json
            dist/releases/0.1.3/platform-verification/
  mps:
    if: ${{ inputs.verify_mps }}
    runs-on: [self-hosted, macOS, ARM64, khquant-mps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --isolated -r app/requirements-czsc-runtime.lock
      - run: python app/build_czsc_runtime.py --out app/vendor/wheels --no-install
      - run: python install.py --venv-dir .venv-ci --device mps
      - run: .venv-ci/bin/python -m pytest app/my_strategy/tests/test_torch_devices.py app/my_strategy/tests/test_czsc_research_ml.py app/my_strategy/tests/test_czsc_predictor_session.py app/my_strategy/tests/test_czsc_compute.py -q
      - run: .venv-ci/bin/python app/verify_installation.py --device mps --output installation-mps.json
      - uses: actions/upload-artifact@v4
        with:
          name: MPS-hardware-verification
          path: installation-mps.json
