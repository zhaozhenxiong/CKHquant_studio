name: Verify bundled Windows release
on:
  workflow_dispatch:
    inputs:
      portable_run_id:
        description: Optional completed portable workflow run; verify its exact combined application and native assets
        type: string
        default: ''
      application_wheel_sha256:
        description: Expected SHA-256 of the portable run's final application wheel
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate optional portable asset selection
        shell: python
        env:
          PORTABLE_RUN_ID: ${{ inputs.portable_run_id }}
          APPLICATION_WHEEL_SHA256: ${{ inputs.application_wheel_sha256 }}
        run: |
          import os, re
          run_id = os.environ['PORTABLE_RUN_ID']
          expected = os.environ['APPLICATION_WHEEL_SHA256']
          if run_id or expected:
              assert re.fullmatch(r'[0-9]+', run_id), 'A completed portable workflow run ID is required'
              assert re.fullmatch(r'[0-9a-f]{64}', expected), 'Both portable run ID and lowercase application SHA-256 are required'
      # Install validates the bundled native asset against the frozen source and SHA.
      - run: python install.py --venv-dir .venv-release --device cpu
      - run: |
          @'
          import importlib.metadata, json
          from pathlib import Path
          entries = json.loads(Path('app/vendor/wheels/wheel-index.json').read_text())['wheels']
          expected = next(e for e in entries if e['filename'].endswith('win_amd64.whl'))
          direct = json.loads(importlib.metadata.distribution('czsc').read_text('direct_url.json'))
          assert direct['archive_info']['hashes']['sha256'] == expected['sha256']
          print('Verified installed CZSC is the bundled Windows asset', expected['sha256'])
          '@ | .venv-release/Scripts/python.exe -I -
      - run: .venv-release/Scripts/python.exe -m my_strategy.scripts.ci_guard --skip-docker
      - if: ${{ inputs.portable_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: KHQuant-source-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.portable_run_id }}
          path: .scratch/portable-release
      - name: Prepare selected portable application and matching native runtime
        if: ${{ inputs.portable_run_id != '' }}
        shell: python
        env:
          APPLICATION_WHEEL_SHA256: ${{ inputs.application_wheel_sha256 }}
        run: |
          import hashlib, json, os, shutil, stat, subprocess, sys
          from pathlib import Path
          from zipfile import ZipFile
          assets = Path('.scratch/portable-release')
          name = 'khquant-0.1.4-py3-none-any.whl'
          wheel = assets / name
          expected = os.environ['APPLICATION_WHEEL_SHA256']
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == expected, 'Selected application wheel SHA-256 mismatch'
          checksums = dict(line.split('  ', 1)[::-1] for line in (assets / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines())
          archive = assets / 'KHQuant-0.1.4.zip'
          assert checksums[name] == expected
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == checksums[archive.name], 'Portable source ZIP SHA-256 mismatch'
          source_root = assets / 'extracted/KHQuant-0.1.4'
          with ZipFile(archive) as zipped:
              for member in zipped.infolist():
                  path = Path(member.filename)
                  assert not path.is_absolute() and path.parts[0] == 'KHQuant-0.1.4'
                  assert '..' not in path.parts and '\\' not in member.filename and ':' not in member.filename
                  assert not stat.S_ISLNK(member.external_attr >> 16), 'Release ZIP must not contain symbolic links'
              zipped.extractall(source_root.parent)
          release = json.loads((source_root / 'release.json').read_text(encoding='utf-8'))
          source_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert release['git_revision'] == source_commit, 'Portable assets belong to another source commit'
          index = json.loads((source_root / 'app/vendor/wheels/wheel-index.json').read_text(encoding='utf-8'))
          with ZipFile(wheel) as installed_wheel:
              actual_index = json.loads(installed_wheel.read('my_strategy/_runtime/vendor/wheels/wheel-index.json'))
          assert actual_index == index, 'Application and portable native provenance indexes differ'
          destination = Path('.scratch/release-wheels') / name
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(wheel, destination)
          subprocess.run([sys.executable, str(source_root / 'install.py'), '--venv-dir',
                          str(Path('.venv-release').resolve()), '--wheel-dir',
                          str((source_root / 'app/vendor/wheels').resolve()), '--device', 'cpu'], check=True)
      - if: ${{ inputs.portable_run_id == '' }}
        run: .venv-release/Scripts/python.exe -m pip wheel . --no-deps --no-build-isolation --wheel-dir .scratch/release-wheels
      - run: .venv-release/Scripts/python.exe -m pip install --no-deps --force-reinstall .scratch/release-wheels/khquant-0.1.4-py3-none-any.whl
      - env:
          PORTABLE_RUN_ID: ${{ inputs.portable_run_id }}
        run: |
          @'
          import hashlib, importlib.metadata, json, os, subprocess, sys
          from pathlib import Path
          from zipfile import ZipFile
          import my_strategy
          path = Path(my_strategy.__file__).resolve()
          assert path.is_relative_to(Path(sys.prefix).resolve()) and 'site-packages' in path.parts
          assert importlib.metadata.version('khquant') == '0.1.4'
          wheel = Path('.scratch/release-wheels/khquant-0.1.4-py3-none-any.whl')
          wheel_sha = hashlib.sha256(wheel.read_bytes()).hexdigest()
          direct = json.loads(importlib.metadata.distribution('khquant').read_text('direct_url.json'))
          assert direct['archive_info']['hashes']['sha256'] == wheel_sha
          with ZipFile(wheel) as zipped:
              index = json.loads(zipped.read('my_strategy/_runtime/vendor/wheels/wheel-index.json'))
          expected_native = next(entry for entry in index['wheels'] if entry['filename'].endswith('win_amd64.whl'))
          native_direct = json.loads(importlib.metadata.distribution('czsc').read_text('direct_url.json'))
          assert native_direct['archive_info']['hashes']['sha256'] == expected_native['sha256']
          identity = {'version': '0.1.4', 'package_path': str(path), 'prefix': sys.prefix,
                      'application_wheel_sha256': wheel_sha,
                      'native_wheel_sha256': expected_native['sha256'],
                      'portable_run_id': os.environ['PORTABLE_RUN_ID'] or None,
                      'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'application_import': 'installed wheel site-packages'}
          Path('installation-windows-identity.json').write_text(json.dumps(identity, indent=2), encoding='utf-8')
          '@ | .venv-release/Scripts/python.exe -I -
      - run: .venv-release/Scripts/python.exe app/verify_installation.py --device cpu --output installation-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-bundled-release-verification
          if-no-files-found: error
          include-hidden-files: true
          path: |
            installation-windows.json
            installation-windows-identity.json
            .scratch/release-wheels/khquant-0.1.4-py3-none-any.whl
